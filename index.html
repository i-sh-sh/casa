<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ניהול הבית — תקציב, מזווה, קניות" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>קאסה — הבית</title>
  </head>
  <body>
    <script>
      // Before first paint, not in React: a stored "dark" applied after mount
      // means a white flash on every launch, which on a phone at night is the
      // most noticeable bug the app has.
      try {
        var t = localStorage.getItem('casa-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
