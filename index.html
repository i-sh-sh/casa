<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ניהול הבית — תקציב, מזווה, קניות" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three families, three jobs. Frank Ruhl Libre is the Hebrew serif of the
      last century and the only one on Google Fonts with a true black — it is
      loaded at 900 and used as a voice, never as body text. Alef (Narkiss
      lineage) is the workhorse, and is deliberately not Heebo or Assistant:
      those two are the default of every Israeli side project, which is exactly
      what makes them read as no decision at all. IBM Plex Mono sets digits and
      nothing else, the way a newspaper sets its tables in a face of their own.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Frank+Ruhl+Libre:wght@900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>קאסה — הבית</title>
  </head>
  <body>
    <script>
      // Before first paint, not in React: a stored "dark" applied after mount
      // means a white flash on every launch, which on a phone at night is the
      // most noticeable bug the app has.
      try {
        var t = localStorage.getItem('casa-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
