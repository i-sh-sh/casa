<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="קאסה">
  <!--
    A ledger page: uncoated paper, ruled, with the money column blocked off
    down the left and a double rule under the total. No rounded corners and
    no house — the app is a book, not a building.
  -->
  <rect width="64" height="64" fill="#f2ede3"/>
  <rect x="10" y="7" width="44" height="50" fill="none" stroke="#1a1a17" stroke-width="3"/>
  <path d="M40 7v50" stroke="#1a1a17" stroke-width="3"/>
  <path d="M17 20h16M17 28h16M17 36h16" stroke="#a9b4bd" stroke-width="2.5"/>
  <path d="M17 44h16" stroke="#a8321e" stroke-width="2.5"/>
  <path d="M44 44h6M44 48h6" stroke="#1a1a17" stroke-width="2.5"/>
</svg>
